name: Zbuduj Plikownik APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dokumenty-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Pobierz projekt
        uses: actions/checkout@v4
      - name: Sprawdz strukture projektu
        run: python3 tools/check_sources.py
      - name: Ustaw Jave
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sprawdz zabezpieczenia podpisu
        run: python3 test_native/check_signing.py
      - name: Ustaw Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Wygeneruj Androida i przywroc nasz kod
        run: python3 tools/prepare_android.py
      - name: Przygotuj podpis
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python3 tools/signing.py
      - name: Pobierz sprawdzony silnik LibreOffice
        run: python3 tools/prepare_engine.py
      - name: Pobierz zaleznosci
        run: flutter pub get
      - name: Sprawdz kod
        run: flutter analyze
      - name: Sprawdz otwieranie dokumentow w interfejsie
        run: flutter test
      - name: Sprawdz zapis i zachowanie tresci DOCX
        run: |
          mkdir -p build/native-tests
          javac -encoding UTF-8 -d build/native-tests native/src/main/java/pl/jarekgadzina/dokumenty/DocumentEdits.java test_native/DocumentEditsTest.java
          java -cp build/native-tests DocumentEditsTest
      - name: Sprawdz wyszukiwanie i zamiane tekstu
        run: |
          mkdir -p build/native-tests
          javac -encoding UTF-8 -d build/native-tests native/src/main/java/pl/jarekgadzina/dokumenty/OfficeSearch.java test_native/OfficeSearchTest.java
          python3 test_native/check_office_search.py build/native-tests
      - name: Sprawdz rozmiary czcionek i odpornosc zapisu na bledy
        run: |
          javac -encoding UTF-8 -d build/native-tests native/src/main/java/pl/jarekgadzina/dokumenty/OfficeFormatting.java native/src/main/java/pl/jarekgadzina/dokumenty/SafeSave.java test_native/OfficeFormattingTest.java test_native/SafeSaveTest.java
          python3 test_native/check_office_formatting.py build/native-tests
          java -cp build/native-tests SafeSaveTest
      - name: Sprawdz zalaczniki udostepnianych plikow
        run: |
          javac -encoding UTF-8 -d build/native-tests native/src/main/java/pl/jarekgadzina/dokumenty/ShareFiles.java test_native/ShareFilesTest.java
          java -cp build/native-tests ShareFilesTest
      - name: Sprawdz zakladki stron
        run: |
          javac -encoding UTF-8 -d build/native-tests native/src/main/java/pl/jarekgadzina/dokumenty/ReadingBookmarks.java test_native/ReadingBookmarksTest.java
          java -cp build/native-tests ReadingBookmarksTest
      - name: Sprawdz zapis zaznaczen i notatek
        run: |
          curl -fL --retry 3 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o build/native-tests/json.jar
          echo '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  build/native-tests/json.jar' | sha256sum -c -
          javac -encoding UTF-8 -cp build/native-tests/json.jar -d build/native-tests native/src/main/java/pl/jarekgadzina/dokumenty/PageHighlights.java test_native/PageHighlightsTest.java
          java -cp build/native-tests:build/native-tests/json.jar PageHighlightsTest
      - name: Sprawdz geometrie PDF i przywracanie kopii
        run: |
          javac -encoding UTF-8 -cp build/native-tests:build/native-tests/json.jar -d build/native-tests native/src/main/java/pl/jarekgadzina/dokumenty/AnnotationGeometry.java native/src/main/java/pl/jarekgadzina/dokumenty/ReaderBackupData.java native/src/main/java/pl/jarekgadzina/dokumenty/ReaderBackupTransaction.java test_native/ReleaseOneTest.java
          java -cp build/native-tests:build/native-tests/json.jar ReleaseOneTest
      - name: Zbuduj APK ARM64
        run: flutter build apk --release --target-platform android-arm64
      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: plikownik-1.0.2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
